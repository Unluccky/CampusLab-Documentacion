services:
  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports: ['127.0.0.1:8025:8025']
    mem_limit: 128m
  notify:
    build: ./notify
    restart: unless-stopped
    mem_limit: 256m
    environment:
      RABBIT_HOST: rabbit1
      RABBIT_USER: ${RABBIT_USER}
      RABBIT_PASSWORD: ${RABBIT_PASSWORD}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      RECEIPTS_DIRECTORY: /data/receipts
    volumes: ['notify-receipts:/data']
    depends_on:
      rabbit1:
        condition: service_healthy
  rabbit-admin:
    build: ./rabbit-admin
    restart: unless-stopped
    mem_limit: 256m
    ports: ['${AMQP_BIND_IP}:8086:8086']
    environment:
      JAVA_TOOL_OPTIONS: '-Xms32m -Xmx128m'
      RABBIT_HOST: rabbit1
      RABBIT_USER: ${RABBIT_USER}
      RABBIT_PASSWORD: ${RABBIT_PASSWORD}
      AZURE_ADMIN_OBJECT_IDS: ${AZURE_ADMIN_OBJECT_IDS:-}
    depends_on:
      rabbit1:
        condition: service_healthy
volumes:
  notify-receipts:
