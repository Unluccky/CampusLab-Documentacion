name: campuslab-ep2
x-app: &app
  build: .
  restart: unless-stopped
  mem_limit: 384m
  volumes: ['./certs:/certs:ro']
  healthcheck:
    test: [CMD-SHELL, 'wget -q -O /dev/null http://localhost:5000/actuator/health']
    interval: 20s
    timeout: 5s
    start_period: 90s
    retries: 6
services:
  catalog:
    <<: *app
    build: ./catalog
    ports: ['8082:5000']
    environment:
      PORT: 5000
      JAVA_TOOL_OPTIONS: '-Xms64m -Xmx192m'
      SPRING_DATASOURCE_URL: jdbc:postgresql://${RDS_HOST}:5432/bdcatalogo?sslmode=verify-full&sslrootcert=/certs/global-bundle.pem
      SPRING_DATASOURCE_USERNAME: campuslabapp
      SPRING_DATASOURCE_PASSWORD: ${RDS_APP_PASSWORD:?Required}
      SPRING_JPA_SHOW_SQL: 'false'
      SPRING_JPA_OPEN_IN_VIEW: 'false'
      AZURE_ENABLED: 'true'
      AZURE_ADMIN_OBJECT_IDS: ${AZURE_ADMIN_OBJECT_IDS:-}
      AZURE_OPERATOR_OBJECT_IDS: ${AZURE_OPERATOR_OBJECT_IDS:-}
  bookings:
    <<: *app
    build: ./bookings
    ports: ['8083:5000']
    environment:
      PORT: 5000
      JAVA_TOOL_OPTIONS: '-Xms64m -Xmx192m'
      SPRING_DATASOURCE_URL: jdbc:postgresql://${RDS_HOST}:5432/bdbookings?sslmode=verify-full&sslrootcert=/certs/global-bundle.pem
      SPRING_DATASOURCE_USERNAME: campuslabapp
      SPRING_DATASOURCE_PASSWORD: ${RDS_APP_PASSWORD:?Required}
      SPRING_JPA_SHOW_SQL: 'false'
      SPRING_JPA_OPEN_IN_VIEW: 'false'
      AZURE_ENABLED: 'true'
      AZURE_ADMIN_OBJECT_IDS: ${AZURE_ADMIN_OBJECT_IDS:-}
      AZURE_OPERATOR_OBJECT_IDS: ${AZURE_OPERATOR_OBJECT_IDS:-}
      CAMPUSLAB_CATALOG_URL: http://catalog:5000
      RABBIT_ENABLED: 'true'
      RABBIT_HOST: ${MQ_HOST:?Required}
      RABBIT_USER: ${RABBIT_USER:?Required}
      RABBIT_PASSWORD: ${RABBIT_PASSWORD:?Required}
  bff:
    <<: *app
    build: ./bff
    ports: ['8081:5000']
    environment:
      PORT: 5000
      JAVA_TOOL_OPTIONS: '-Xms64m -Xmx128m'
      AZURE_ENABLED: 'true'
      AZURE_ADMIN_OBJECT_IDS: ${AZURE_ADMIN_OBJECT_IDS:-}
      AZURE_OPERATOR_OBJECT_IDS: ${AZURE_OPERATOR_OBJECT_IDS:-}
      CATALOG_BASE_URL: http://catalog:5000
      CAMPUSLAB_BOOKINGS_URL: http://bookings:5000
      CAMPUSLAB_RABBIT_ADMIN_URL: http://${MQ_HOST}:8086
