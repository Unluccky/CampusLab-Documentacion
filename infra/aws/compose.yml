name: campuslab
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: bdcatalogo
      POSTGRES_USER: campuslab
      POSTGRES_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?Defina la contraseña fuera del repositorio}
    volumes:
      - catalog_data:/var/lib/postgresql/data
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campuslab -d bdcatalogo"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 384m

  catalog:
    build:
      context: .
      dockerfile: Dockerfile.catalog
    image: campuslab-catalog:ea1
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8082:8082"
    environment:
      PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/bdcatalogo
      SPRING_DATASOURCE_USERNAME: campuslab
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?Defina la contraseña fuera del repositorio}
      JWT_ISSUER_URI: https://cognito-idp.us-east-1.amazonaws.com/us-east-1_prknJHWXE
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx512m
      SPRING_JPA_SHOW_SQL: "false"
      SPRING_JPA_OPEN_IN_VIEW: "false"
      SPRINGDOC_API_DOCS_ENABLED: "false"
      SPRINGDOC_SWAGGER_UI_ENABLED: "false"
    networks:
      - database
      - outbound
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8082/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5
    mem_limit: 1024m

networks:
  database:
    internal: true
  outbound:

volumes:
  catalog_data:
