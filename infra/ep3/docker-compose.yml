name: campuslab-ep3

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.1
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    mem_limit: 256m

  kafka-1:
    image: confluentinc/cp-kafka:7.7.1
    restart: unless-stopped
    depends_on: [zookeeper]
    ports: ["9092:9092"]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://:29092,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:29092,PLAINTEXT_HOST://${KAFKA_PRIVATE_HOST}:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
    mem_limit: 768m

  kafka-2:
    image: confluentinc/cp-kafka:7.7.1
    restart: unless-stopped
    depends_on: [zookeeper]
    ports: ["9094:9094"]
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://:29092,PLAINTEXT_HOST://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:29092,PLAINTEXT_HOST://${KAFKA_PRIVATE_HOST}:9094
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
    mem_limit: 768m

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    restart: unless-stopped
    depends_on: [kafka-1, kafka-2]
    ports: ["127.0.0.1:8080:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: campuslab-ep3
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:29092,kafka-2:29092
      DYNAMIC_CONFIG_ENABLED: "true"
    mem_limit: 256m

  reportes:
    build: ../../../campuslab_reportes
    restart: unless-stopped
    depends_on: [kafka-1, kafka-2]
    ports: ["8085:8085"]
    environment:
      PORT: 8085
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:29092,kafka-2:29092
      KAFKA_RESERVATION_TOPIC: campuslab.reservas.v1
      SPRING_DATASOURCE_URL: ${REPORTS_DB_URL:?Definir REPORTS_DB_URL}
      SPRING_DATASOURCE_USERNAME: ${RDS_APP_USER:?Definir RDS_APP_USER}
      SPRING_DATASOURCE_PASSWORD: ${RDS_APP_PASSWORD:?Definir RDS_APP_PASSWORD}
      JWT_ISSUER_URI: ${JWT_ISSUER_URI}
      CAMPUSLAB_AZURE_ENABLED: "${CAMPUSLAB_AZURE_ENABLED:-true}"
      AZURE_ADMIN_OBJECT_IDS: ${AZURE_ADMIN_OBJECT_IDS:-}
      CAMPUSLAB_ALLOWED_ORIGINS: ${CAMPUSLAB_ALLOWED_ORIGINS}
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx384m
    volumes: ["./certs:/certs:ro"]
    mem_limit: 512m

  prometheus:
    image: prom/prometheus:v3.0.1
    restart: unless-stopped
    ports: ["127.0.0.1:9090:9090"]
    volumes: ["./prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    mem_limit: 256m

  grafana:
    image: grafana/grafana:11.4.0
    restart: unless-stopped
    ports: ["127.0.0.1:3000:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Definir GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - "grafana-data:/var/lib/grafana"
      - "./grafana/provisioning:/etc/grafana/provisioning:ro"
      - "./grafana/dashboards:/var/lib/grafana/dashboards:ro"
    mem_limit: 384m

volumes:
  grafana-data:
